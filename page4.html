<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Autres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    body {
      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow-x: hidden;
      -webkit-touch-callout: none;
      background-color: #1a1a1a;
      background-image: url("images/background.jpg");
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      padding: 0 30px;
      gap: 30px;
      z-index: 200;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav a {
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    nav a:hover { opacity: 0.6; }

    .nav-links { display: flex; align-items: center; gap: 30px; }

    .dropdown { position: relative; height: 60px; display: flex; align-items: center; }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 60px; left: 0;
      background: rgba(10, 10, 10, 0.97);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 0;
      min-width: 220px;
      flex-direction: column;
      z-index: 300;
    }
    .dropdown:hover .dropdown-menu { display: flex; }
    .dropdown-menu a { padding: 10px 20px; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; opacity: 0.7; }
    .dropdown-menu a:hover { opacity: 1; }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      margin-left: auto;
      padding: 8px;
      background: none;
      border: none;
    }
    .nav-toggle span { display: block; width: 24px; height: 2px; background: #fff; transition: all 0.3s ease; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    section {
      padding: 110px 8vw 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    section h2 {
      font-size: clamp(1.3rem, 3vw, 2rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 50px;
      width: 100%;
      max-width: 1500px;
      text-align: left;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1500px;
    }

    .collab-item { display: flex; flex-direction: column; }

    .img-wrapper {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #000;
    }
    .img-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
      pointer-events: none;
    }
    .img-wrapper:hover img { transform: scale(1.05); }

    .img-wrapper.wide { grid-column: span 2; }

    /* Logos PNG : fond transparent, on garde leur format d'origine */
    .img-wrapper.logo-card {
      background: transparent;
      padding: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrapper.logo-card img {
      height: auto;
    }
    .img-wrapper.logo-card:hover img { transform: scale(1.08); }
    /* Le logo Tool IA remplit tout son canevas (pas de marge interne),
       contrairement à Betsmart : on le réduit pour un rendu visuel équivalent */
    .img-wrapper.logo-card.tool-ia img {
      width: 75%;
    }

    /* REBRANDING — avant / après */
    .rebrand-block {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 24px;
    }
    .rebrand-images {
      display: flex;
      align-items: stretch;
      gap: 18px;
    }
    .rebrand-half {
      position: relative;
      flex: 1;
      cursor: pointer;
      overflow: hidden;
      border-radius: 10px;
      aspect-ratio: 2 / 3;
      background: #000;
    }
    .rebrand-half img {
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
      transition: transform 0.4s ease;
    }
    .rebrand-half:hover img { transform: scale(1.04); }
    .rebrand-tag {
      position: absolute;
      top: 14px; left: 14px;
      padding: 6px 16px;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .rebrand-half.after .rebrand-tag {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .rebrand-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      opacity: 0.4;
      width: 24px;
    }
    .rebrand-caption {
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .collab-caption {
      margin-top: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .collab-caption a { color: white; text-decoration: none; opacity: 1; }
    .collab-caption a:hover { opacity: 0.7; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 500;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      cursor: pointer;
      padding: 20px;
      opacity: 0.7;
      user-select: none;
      z-index: 501;
    }
    .arrow:hover { opacity: 1; }
    .arrow.left { left: 20px; }
    .arrow.right { right: 20px; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav { flex-wrap: wrap; gap: 0; padding: 0 20px; height: auto; min-height: 60px; }
      .nav-toggle { display: flex; }

      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        background: rgba(0,0,0,0.97);
        padding: 10px 0 20px;
        gap: 0;
        align-items: flex-start;
      }
      .nav-links.open { display: flex; }
      .nav-links > a { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 0.85rem; }
      .dropdown { height: auto; flex-direction: column; align-items: flex-start; width: 100%; }
      .dropdown > a { padding: 12px 20px; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.07); }
      .dropdown-menu { display: none !important; position: static; background: rgba(255,255,255,0.05); border-top: none; padding: 0; min-width: unset; width: 100%; }
      .dropdown.open .dropdown-menu { display: flex !important; }
      .dropdown-menu a { padding: 10px 35px; font-size: 0.78rem; }

      section { padding: 80px 5vw 60px; }
      .gallery { grid-template-columns: 1fr; gap: 16px; }
      .img-wrapper.wide { grid-column: span 1; }

      .rebrand-block { grid-column: span 1; padding: 16px; }
      .rebrand-images { flex-direction: column; }
      .rebrand-divider { width: auto; transform: rotate(90deg); padding: 4px 0; }
      .rebrand-half { aspect-ratio: 3 / 4; }

      .arrow { font-size: 2rem; padding: 12px; }
      .arrow.left { left: 5px; }
      .arrow.right { right: 5px; }
    }

    
  </style>
</head>
<body oncontextmenu="return false;">

  <nav id="main-nav">
    <div class="nav-links" id="nav-links">
      <a href="index.html" onclick="closeMobileNav()">Accueil</a>

      <div class="dropdown" id="dropdown-projets">
        <a href="index.html#projets" onclick="toggleDropdown('dropdown-projets', event)">Projets personnels</a>
        <div class="dropdown-menu">
          <a href="personnel.html">Affiches sportives</a>
          <a href="collaborations.html">Collaborations</a>
          <a href="page3.html">Affiches cinématographiques</a>
          <a href="page4.html">Autres</a>
        </div>
      </div>

      <a href="contact.html" onclick="closeMobileNav()">Contact</a>
    </div>

    <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <section>
    <h2>Autres</h2>
    <div class="gallery">

       <div class="img-wrapper" onclick="openLightbox(this)"><img src="images/rap.jpg"></div>
       <div class="img-wrapper" onclick="openLightbox(this)"><img src="images/stickers.jpg"></div>
       <div class="img-wrapper logo-card" onclick="openLightbox(this)"><img src="images/logo betsmart.png"></div>
       <div class="img-wrapper logo-card tool-ia" onclick="openLightbox(this)"><img src="images/tool ia.png"></div>

       <div class="rebrand-block">
         <div class="rebrand-images">
           <div class="rebrand-half before" onclick="openLightbox(this)">
             <img src="images/grammoirienne2.jpeg">
             <span class="rebrand-tag">Avant</span>
           </div>
           <div class="rebrand-divider">&#8594;</div>
           <div class="rebrand-half after" onclick="openLightbox(this)">
             <img src="images/grammoirienne.jpg">
             <span class="rebrand-tag">Après</span>
           </div>
         </div>
         <div class="rebrand-caption">Rebranding — La Grammoirienne</div>
       </div>

    </div>
  </section>

  <div class="lightbox" onclick="closeLightbox()">
    <span class="arrow left" onclick="prevImage(event)">&#10094;</span>
    <img src="">
    <span class="arrow right" onclick="nextImage(event)">&#10095;</span>
  </div>

  <script>
    const images = Array.from(document.querySelectorAll('.gallery img'));
    let currentIndex = 0;

    function openLightbox(wrapper) {
      const img = wrapper.querySelector('img');
      currentIndex = images.indexOf(img);
      showImage();
      document.querySelector('.lightbox').classList.add('active');
    }
    function showImage() {
      document.querySelector('.lightbox img').src = images[currentIndex].src;
    }
    function closeLightbox() {
      document.querySelector('.lightbox').classList.remove('active');
    }
    function nextImage(event) {
      event.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    }
    function prevImage(event) {
      event.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    }
    document.addEventListener('keydown', e => {
      if (!document.querySelector('.lightbox').classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextImage(e);
      if (e.key === 'ArrowLeft') prevImage(e);
      if (e.key === 'Escape') closeLightbox();
    });

    function toggleNav() {
      document.getElementById('nav-links').classList.toggle('open');
      document.getElementById('nav-toggle').classList.toggle('open');
    }
    function closeMobileNav() {
      document.getElementById('nav-links').classList.remove('open');
      document.getElementById('nav-toggle').classList.remove('open');
    }
    function toggleDropdown(id, event) {
      if (window.innerWidth <= 768) {
        event.preventDefault();
        document.getElementById(id).classList.toggle('open');
      }
    }
  </script>
</body>
</html>
