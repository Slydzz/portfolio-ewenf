<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    body {
      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow-x: hidden;
      -webkit-touch-callout: none;
      background-color: #1a1a1a;
      background-image: url("images/background.jpg");
    }

    #home { background-image: url("images/portfolio.jpg"); }

    /* HEADER */
    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    header h1 {
      font-size: clamp(4rem, 12vw, 12rem);
      letter-spacing: 0.2em;
    }

    header .subtitle {
      margin-top: 20px;
      font-size: clamp(1rem, 2.5vw, 2rem);
      letter-spacing: 0.15em;
      opacity: 0.8;
      text-transform: uppercase;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      padding: 0 30px;
      gap: 30px;
      z-index: 200;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav a {
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: opacity 0.3s ease;
      line-height: 60px;
      white-space: nowrap;
    }
    nav a:hover { opacity: 0.6; }

    .nav-links { display: flex; align-items: center; gap: 30px; }

    .dropdown {
      position: relative;
      height: 60px;
      display: flex;
      align-items: center;
    }
    .dropdown > a { line-height: normal; }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 60px; left: 0;
      background: rgba(10, 10, 10, 0.97);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 0;
      min-width: 220px;
      flex-direction: column;
      z-index: 300;
    }
    .dropdown:hover .dropdown-menu { display: flex; }
    .dropdown-menu a {
      padding: 10px 20px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.7;
      line-height: normal;
    }
    .dropdown-menu a:hover { opacity: 1; }

    /* BURGER */
    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      margin-left: auto;
      padding: 8px;
      background: none;
      border: none;
    }
    .nav-toggle span {
      display: block;
      width: 24px; height: 2px;
      background: #fff;
      transition: all 0.3s ease;
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* SECTION */
    section {
      padding: 110px 8vw 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    section h2 {
      font-size: clamp(1.3rem, 3vw, 2rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 50px;
      width: 100%;
      max-width: 1200px;
      text-align: left;
    }

    /* GRILLE 2x2 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 1200px;
    }

    .grid-card {
      color: white;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #111;
      aspect-ratio: 16 / 10;
      text-decoration: none;
      display: block;
    }

    .grid-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      pointer-events: none;
      display: block;
    }
    .grid-card:hover img { transform: scale(1.05); }

    .card-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0, 0, 0, 0.75);
      padding: 14px 18px;
      text-align: center;
    }

    .card-caption .title {
      font-size: clamp(0.7rem, 1.5vw, 0.95rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav { flex-wrap: wrap; gap: 0; padding: 0 20px; height: auto; min-height: 60px; position: fixed; }
      .nav-toggle { display: flex; }

      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        background: rgba(0,0,0,0.97);
        padding: 10px 0 20px;
        gap: 0;
        align-items: flex-start;
      }
      .nav-links.open { display: flex; }
      .nav-links > a {
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        font-size: 0.85rem;
        line-height: normal;
      }

      .dropdown {
        height: auto;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
      }
      .dropdown > a {
        padding: 12px 20px;
        width: 100%;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        line-height: normal;
      }
      .dropdown-menu {
        display: none !important;
        position: static;
        background: rgba(255,255,255,0.05);
        border-top: none;
        padding: 0;
        min-width: unset;
        width: 100%;
      }
      .dropdown.open .dropdown-menu { display: flex !important; }
      .dropdown-menu a { padding: 10px 35px; font-size: 0.78rem; }

      .grid { grid-template-columns: 1fr; }

      section { padding: 80px 5vw 60px; }

      header h1 { letter-spacing: 0.1em; }
    }

    @media (max-width: 480px) {
      .card-caption { padding: 10px 12px; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <nav id="main-nav">
    <div class="nav-links" id="nav-links">
      <a onclick="closeMobileNav(); scrollToSection('home')">Accueil</a>

      <div class="dropdown" id="dropdown-projets">
        <a href="index.html#projets" onclick="toggleDropdown('dropdown-projets', event)">Projets personnels</a>
        <div class="dropdown-menu">
          <a href="personnel.html">Affiches sportives</a>
          <a href="collaborations.html">Collaborations</a>
          <a href="page3.html">Affiches cinématographiques</a>
          <a href="page4.html">Autres</a>
        </div>
      </div>

      <a href="contact.html" onclick="closeMobileNav()">Contact</a>
    </div>

    <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <header id="home"></header>

  <section id="projets">
    <h2>Projets personnels</h2>
    <div class="grid">
      <a class="grid-card" href="personnel.html">
        <img src="images/affiche_sport.jpg" alt="Affiches sportives">
        <div class="card-caption"><div class="title">Affiches sportives</div></div>
      </a>
      <a class="grid-card" href="collaborations.html">
        <img src="images/collabs.jpg" alt="Collaborations">
        <div class="card-caption"><div class="title">Collaborations</div></div>
      </a>
      <a class="grid-card" href="page3.html">
        <img src="images/affiches_cinema.jpg" alt="Affiches cinématographiques">
        <div class="card-caption"><div class="title">Affiches cinématographiques</div></div>
      </a>
      <a class="grid-card" href="page4.html">
        <img src="images/autres.jpg" alt="Autres">
        <div class="card-caption"><div class="title">Autres</div></div>
      </a>
    </div>
  </section>

  <script>
    function scrollToSection(id) {
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }
    function toggleNav() {
      const links = document.getElementById('nav-links');
      const toggle = document.getElementById('nav-toggle');
      links.classList.toggle('open');
      toggle.classList.toggle('open');
    }
    function closeMobileNav() {
      document.getElementById('nav-links').classList.remove('open');
      document.getElementById('nav-toggle').classList.remove('open');
    }
    function toggleDropdown(id, event) {
      if (window.innerWidth <= 768) {
        event.preventDefault();
        document.getElementById(id).classList.toggle('open');
      }
    }
  </script>
</body>
</html>
