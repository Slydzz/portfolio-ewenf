<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    body {
      font-family: 'Arial', sans-serif;
      color: #fff;
      background-color: #0d0d0d;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      padding: 0 30px;
      gap: 30px;
      z-index: 200;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav a {
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    nav a:hover { opacity: 0.6; }

    .nav-links { display: flex; align-items: center; gap: 30px; }

    .dropdown {
      position: relative;
      height: 60px;
      display: flex;
      align-items: center;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 60px; left: 0;
      background: rgba(10, 10, 10, 0.97);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 0;
      min-width: 220px;
      flex-direction: column;
      z-index: 300;
    }
    .dropdown:hover .dropdown-menu { display: flex; }
    .dropdown-menu a {
      padding: 10px 20px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.7;
    }
    .dropdown-menu a:hover { opacity: 1; }

    /* BURGER */
    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      margin-left: auto;
      padding: 8px;
      background: none;
      border: none;
    }
    .nav-toggle span { display: block; width: 24px; height: 2px; background: #fff; transition: all 0.3s ease; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* PAGE */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 8vw 60px;
      position: relative;
      overflow: hidden;
    }

    .hero-text { position: relative; z-index: 1; margin-bottom: 60px; }

    .hero-text .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.4;
      margin-bottom: 24px;
    }

    .hero-text h1 {
      font-size: clamp(2.8rem, 8vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .hero-text h1 .outline {
      -webkit-text-stroke: 1px rgba(255,255,255,0.5);
      color: transparent;
    }

    /* GRILLE CONTACT */
    .contact-grid {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-top: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 60px;
    }

    .contact-item {
      padding: 36px 40px 36px 0;
      border-right: 1px solid rgba(255,255,255,0.12);
    }
    .contact-item:not(:first-child) { padding-left: 40px; }
    .contact-item:last-child { border-right: none; }

    .contact-item .label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.35;
      margin-bottom: 12px;
    }

    .contact-item .value {
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .contact-item .value a {
      color: #fff;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .contact-item .value a:hover { opacity: 0.5; }

    /* RÉSEAUX */
    .socials {
      position: relative; z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      padding-bottom: 60px;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 36px;
      align-items: center;
    }

    .socials .label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.35;
      margin-right: 10px;
    }

    .socials a {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s ease;
      position: relative;
    }
    .socials a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1px;
      background: #fff;
      transition: width 0.3s ease;
    }
    .socials a:hover { opacity: 1; }
    .socials a:hover::after { width: 100%; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav { flex-wrap: wrap; gap: 0; padding: 0 20px; height: auto; min-height: 60px; }
      .nav-toggle { display: flex; }

      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        background: rgba(0,0,0,0.97);
        padding: 10px 0 20px;
        gap: 0;
        align-items: flex-start;
      }
      .nav-links.open { display: flex; }
      .nav-links > a {
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        font-size: 0.85rem;
      }
      .dropdown { height: auto; flex-direction: column; align-items: flex-start; width: 100%; }
      .dropdown > a { padding: 12px 20px; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.07); }
      .dropdown-menu { display: none !important; position: static; background: rgba(255,255,255,0.05); border-top: none; padding: 0; min-width: unset; width: 100%; }
      .dropdown.open .dropdown-menu { display: flex !important; }
      .dropdown-menu a { padding: 10px 35px; font-size: 0.78rem; }

      .page { padding: 90px 6vw 40px; justify-content: flex-start; }

      .contact-grid {
        grid-template-columns: 1fr;
      }
      .contact-item {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        padding: 24px 0;
      }
      .contact-item:not(:first-child) { padding-left: 0; }
      .contact-item:last-child { border-bottom: none; }

      .socials { gap: 20px; padding-top: 24px; }
      .hero-text { margin-bottom: 40px; }
    }
  </style>
</head>
<body>

  <nav id="main-nav">
    <div class="nav-links" id="nav-links">
      <a href="index.html" onclick="closeMobileNav()">Accueil</a>

      <div class="dropdown" id="dropdown-projets">
        <a href="index.html#projets" onclick="toggleDropdown('dropdown-projets', event)">Projets personnels</a>
        <div class="dropdown-menu">
          <a href="personnel.html">Affiches sportives</a>
          <a href="collaborations.html">Collaborations</a>
          <a href="page3.html">Affiches cinématographiques</a>
          <a href="page4.html">Autres</a>
        </div>
      </div>

      <a href="contact.html" onclick="closeMobileNav()">Contact</a>
    </div>

    <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="page">
    <div class="hero-text">
      <p class="eyebrow">Disponible pour des projets</p>
      <h1>Travaillons<br><span class="outline">ensemble.</span></h1>
    </div>

    <div class="contact-grid">
      <div class="contact-item">
        <p class="label">Informations personelles</p>
        <p class="value">Ewen Fontaine | 21 ans | Français</p>
      </div>
      <div class="contact-item">
        <p class="label">Email</p>
        <p class="value"><a href="mailto:ewenfontaine49@gmail.com">ewenfontaine49@gmail.com</a></p>
      </div>
      <div class="contact-item">
        <p class="label">Téléphone</p>
        <p class="value">+33 7 49 47 84 98</p>
      </div>
    </div>

    <div class="socials">
      <span class="label">Réseaux</span>
      <a href="https://www.instagram.com/slydzz.graphism/" target="_blank">Instagram</a>
    </div>
  </div>

  <script>
    function toggleNav() {
      document.getElementById('nav-links').classList.toggle('open');
      document.getElementById('nav-toggle').classList.toggle('open');
    }
    function closeMobileNav() {
      document.getElementById('nav-links').classList.remove('open');
      document.getElementById('nav-toggle').classList.remove('open');
    }
    function toggleDropdown(id, event) {
      if (window.innerWidth <= 768) {
        event.preventDefault();
        document.getElementById(id).classList.toggle('open');
      }
    }
  </script>
</body>
</html>
